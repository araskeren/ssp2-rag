# Konfigurasi alembic untuk pemakaian manual: `uv run alembic upgrade head`.
# Aplikasi sendiri memakai ai_service.db.migrate (URL dari env, tanpa file ini).
[alembic]
script_location = src/ai_service/db/alembic
prepend_sys_path = src
sqlalchemy.url =

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
