scope:
  postgres:
    facility_id: r."facilityId"
    provinsi_kode: f."provinsiKode"
    kabupaten_kota_kode: f."kabupatenKotaKode"
  clickhouse:
    facility_id: facility_id
    provinsi_kode: facility_provinsi_kode
    kabupaten_kota_kode: facility_kab_kota_kode
contoh:
- pertanyaan: Berapa kasus konfirmasi COVID-19 per provinsi tahun 2025?
  sql: SELECT facility_provinsi_name AS provinsi, COUNT(DISTINCT record_id) AS kasus_konfirmasi FROM dn_covid_19_surveilans WHERE epi_year_record = 2025 AND LOWER(record_status) LIKE '%konfirmasi%' GROUP BY facility_provinsi_name ORDER BY kasus_konfirmasi DESC
- pertanyaan: Berapa kasus COVID-19 yang meninggal tahun ini?
  sql: SELECT COUNT(DISTINCT record_id) AS kasus_meninggal FROM dn_covid_19_surveilans WHERE LOWER(outcome) LIKE '%meninggal%' AND EXTRACT(YEAR FROM tanggal_outcome) = EXTRACT(YEAR FROM CURRENT_DATE)
sql:
  postgres: |
    SELECT
      r.id AS record_id,
      r."createdAt"::date AS record_date,
      EXTRACT(WEEK FROM r."createdAt")::int AS epi_week_record,
      EXTRACT(ISOYEAR FROM r."createdAt")::int AS epi_year_record,
      r.status AS record_status,
      r."currentStage" AS current_stage,
      r."isActive" AS is_active,
      r."facilityId" AS facility_id,
      f.name AS facility_name,
      f."provinsiKode" AS facility_provinsi_kode,
      f."kabupatenKotaKode" AS facility_kab_kota_kode,
      fp.name AS facility_provinsi_name,
      fk.name AS facility_kab_kota_name,
      p.sex AS patient_sex,
      EXTRACT(YEAR FROM age(p."birthDate"))::int AS patient_age_years,
      p."primaryProvinceCode" AS patient_provinsi_kode,
      p."primaryCityCode" AS patient_kab_kota_kode,
      pp.name AS patient_provinsi_name,
      pk.name AS patient_kab_kota_name,
      s.id AS specimen_id,
      s.nomor_spesimen AS nomor_spesimen,
      s.jenis_spesimen AS jenis_spesimen,
      s.tujuan_pemeriksaan AS tujuan_pemeriksaan,
      s.tanggal_ambil AS tanggal_ambil,
      s.tanggal_pengiriman AS tanggal_pengiriman,
      s.tanggal_penerimaan AS tanggal_penerimaan,
      s.status AS specimen_status,
      s.alasan_penolakan AS alasan_penolakan,
      s.lab_tujuan_id AS lab_tujuan_id,
      lg.name AS lab_tujuan_name,
      EXTRACT(WEEK FROM s.tanggal_ambil)::int AS epi_week_ambil,
      EXTRACT(ISOYEAR FROM s.tanggal_ambil)::int AS epi_year_ambil,
      t.id AS test_result_id,
      t."jenisPemeriksaan" AS jenis_pemeriksaan,
      t.kesimpulan AS kesimpulan,
      t.tanggal_periksa AS tanggal_periksa,
      t.tanggal_hasil AS tanggal_hasil,
      COALESCE(t.tanggal_hasil, t.tanggal_periksa) AS tanggal_hasil_efektif,
      EXTRACT(WEEK FROM COALESCE(t.tanggal_hasil, t.tanggal_periksa))::int AS epi_week_hasil,
      EXTRACT(ISOYEAR FROM COALESCE(t.tanggal_hasil, t.tanggal_periksa))::int AS epi_year_hasil,
      r.suhu_tubuh AS suhu_tubuh,
      r.outcome AS outcome,
      r.tanggal_outcome AS tanggal_outcome
    FROM covid_19.records r
    LEFT JOIN covid_19.specimens s ON s."recordId" = r.id
    LEFT JOIN covid_19.test_results t ON t."specimenId" = s.id
    LEFT JOIN master.patients p ON p.id = r."patientId"
    LEFT JOIN master.facilities f ON f.id = r."facilityId"
    LEFT JOIN master.facilities lg ON lg.id = s.lab_tujuan_id
    LEFT JOIN master.regions fp ON fp.code = f."provinsiKode" AND fp.level = 'PROVINCE'
    LEFT JOIN master.regions fk ON fk.code = f."kabupatenKotaKode" AND fk.level = 'CITY'
    LEFT JOIN master.regions pp ON pp.code = p."primaryProvinceCode" AND pp.level = 'PROVINCE'
    LEFT JOIN master.regions pk ON pk.code = p."primaryCityCode" AND pk.level = 'CITY'
    WHERE {scope_filter}
  clickhouse: |
    SELECT * EXCEPT (patient_name, patient_birth_date) FROM satu_data_penyakit.dn_covid_19_surveilans WHERE {scope_filter}
catatan: Wilayah pelaporan mengikuti faskes pelapor (facility_*); wilayah domisili pasien ada di patient_*.
