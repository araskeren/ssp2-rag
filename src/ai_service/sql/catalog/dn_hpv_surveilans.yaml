scope:
  postgres:
    facility_id: r."facilityId"
    provinsi_kode: f."provinsiKode"
    kabupaten_kota_kode: f."kabupatenKotaKode"
  clickhouse:
    facility_id: facility_id
    provinsi_kode: facility_provinsi_kode
    kabupaten_kota_kode: facility_kab_kota_kode
contoh:
- pertanyaan: Berapa perempuan yang diskrining IVA per provinsi tahun 2025 dan berapa yang positif?
  sql: SELECT facility_provinsi_name AS provinsi, COUNT(DISTINCT record_id) AS jumlah_skrining, COUNT(DISTINCT CASE WHEN LOWER(hasil_iva) LIKE '%positif%' THEN record_id END) AS iva_positif FROM dn_hpv_surveilans WHERE EXTRACT(YEAR FROM tanggal_skrining) = 2025 GROUP BY facility_provinsi_name ORDER BY jumlah_skrining DESC
sql:
  postgres: |
    SELECT
      r.id AS record_id,
      r."createdAt"::date AS record_date,
      EXTRACT(WEEK FROM r."createdAt")::int AS epi_week_record,
      EXTRACT(ISOYEAR FROM r."createdAt")::int AS epi_year_record,
      r.status AS record_status,
      r."currentStage" AS current_stage,
      r."isActive" AS is_active,
      r."facilityId" AS facility_id,
      f.name AS facility_name,
      f."provinsiKode" AS facility_provinsi_kode,
      f."kabupatenKotaKode" AS facility_kab_kota_kode,
      fp.name AS facility_provinsi_name,
      fk.name AS facility_kab_kota_name,
      p.sex AS patient_sex,
      EXTRACT(YEAR FROM age(p."birthDate"))::int AS patient_age_years,
      p."primaryProvinceCode" AS patient_provinsi_kode,
      p."primaryCityCode" AS patient_kab_kota_kode,
      pp.name AS patient_provinsi_name,
      pk.name AS patient_kab_kota_name,
      s.id AS specimen_id,
      s."nomorSpesimen" AS nomor_spesimen,
      s."jenisSpesimen" AS jenis_spesimen,
      CAST(NULL AS varchar) AS tujuan_pemeriksaan,
      s."tanggalPenarikanSpesimen" AS tanggal_ambil,
      s."tanggalPengiriman" AS tanggal_pengiriman,
      s."tanggalPenerimaan" AS tanggal_penerimaan,
      s.status AS specimen_status,
      s."catatanPenerimaan" AS alasan_penolakan,
      s."laboratoriumTujuanId" AS lab_tujuan_id,
      lg.name AS lab_tujuan_name,
      EXTRACT(WEEK FROM s."tanggalPenarikanSpesimen")::int AS epi_week_ambil,
      EXTRACT(ISOYEAR FROM s."tanggalPenarikanSpesimen")::int AS epi_year_ambil,
      t.id AS test_result_id,
      t."jenisPemeriksaan" AS jenis_pemeriksaan,
      t."hasilTes" AS kesimpulan,
      t."tanggalPemeriksaan" AS tanggal_periksa,
      t."tanggalHasil" AS tanggal_hasil,
      COALESCE(t."tanggalHasil", t."tanggalPemeriksaan") AS tanggal_hasil_efektif,
      EXTRACT(WEEK FROM COALESCE(t."tanggalHasil", t."tanggalPemeriksaan"))::int AS epi_week_hasil,
      EXTRACT(ISOYEAR FROM COALESCE(t."tanggalHasil", t."tanggalPemeriksaan"))::int AS epi_year_hasil,
      r."tanggalSkrining" AS tanggal_skrining,
      r."metodeDeteksiDini" AS metode_deteksi_dini,
      r."hasilIva" AS hasil_iva,
      r."tanggalPemeriksaanIva" AS tanggal_pemeriksaan_iva,
      r."tindakLanjutIva" AS tindak_lanjut_iva,
      r."statusHiv" AS status_hiv,
      r."riwayatIms" AS riwayat_ims,
      r."kontrasepsiSaatIni" AS kontrasepsi_saat_ini,
      r."riwayatImunisasiHpv" AS riwayat_imunisasi_hpv
    FROM hpv.records r
    LEFT JOIN hpv.specimens s ON s."recordId" = r.id
    LEFT JOIN hpv.test_results t ON t."specimenId" = s.id
    LEFT JOIN master.patients p ON p.id = r."patientId"
    LEFT JOIN master.facilities f ON f.id = r."facilityId"
    LEFT JOIN master.facilities lg ON lg.id = s."laboratoriumTujuanId"
    LEFT JOIN master.regions fp ON fp.code = f."provinsiKode" AND fp.level = 'PROVINCE'
    LEFT JOIN master.regions fk ON fk.code = f."kabupatenKotaKode" AND fk.level = 'CITY'
    LEFT JOIN master.regions pp ON pp.code = p."primaryProvinceCode" AND pp.level = 'PROVINCE'
    LEFT JOIN master.regions pk ON pk.code = p."primaryCityCode" AND pk.level = 'CITY'
    WHERE {scope_filter}
  clickhouse: |
    SELECT * EXCEPT (patient_name, patient_birth_date) FROM satu_data_penyakit.dn_hpv_surveilans WHERE {scope_filter}
catatan: Entitas HPV memakai nama kolom camelCase berbeda dari modul lain (sudah dipetakan). Wilayah pelaporan mengikuti faskes pelapor (facility_*); wilayah domisili pasien ada di patient_*.
